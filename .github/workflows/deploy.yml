name: ComanShanks CI/CD Pipeline

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest


        steps:
            - name: Checkout code
              uses: actions/checkout@v4


            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{secrets.DOCKER_USERNAME}}
                password: ${{secrets.DOCKER_PASSWORD}}


            - name: Build and push Client
              run: |
                docker build -t ${{secrets.DOCKER_USERNAME}}/food-app-client:latest ./client
                docker push ${{secrets.DOCKER_USERNAME}}/food-app-client:latest


            - name: Build and push Server
              run: |
                docker build -t ${{secrets.DOCKER_USERNAME}}/food-app-server:latest ./server
                docker push ${{secrets.DOCKER_USERNAME}}/food-app-server:latest